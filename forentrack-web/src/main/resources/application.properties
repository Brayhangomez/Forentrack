spring.application.name=forentrack-web
server.port=${PORT:8080}

# La interfaz solo habla con el API Gateway (punto de entrada único)
gateway.api.url=${GATEWAY_API_URL:http://localhost:8090}

# Cookie de sesión protegida; el JWT vive solo en la sesión del servidor
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=${SESSION_TIMEOUT:120m}

# Página de error propia (templates/error.html)
server.error.whitelabel.enabled=false
