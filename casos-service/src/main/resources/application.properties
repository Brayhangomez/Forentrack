spring.application.name=casos-service
server.port=${PORT:8082}

# Base MongoDB propia del servicio
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/casos_db}
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/casos_db}
spring.data.mongodb.auto-index-creation=true

# Secreto compartido con usuarios-service (obligatorio, mínimo 32 caracteres)
app.jwt.secret=${JWT_SECRET:}

# Todas las llamadas entre servicios pasan por el API Gateway
gateway.api.url=${GATEWAY_API_URL:http://localhost:8090}

springdoc.swagger-ui.path=/swagger-ui.html
