spring.application.name=auditoria-service
server.port=${PORT:8085}

# Base MongoDB propia del servicio
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/auditoria_db}
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/auditoria_db}
spring.data.mongodb.auto-index-creation=true

# Secreto compartido con usuarios-service (obligatorio, mínimo 32 caracteres)
app.jwt.secret=${JWT_SECRET:}

springdoc.swagger-ui.path=/swagger-ui.html
