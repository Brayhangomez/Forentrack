    name: forentrack-v2-custodia
    runtime: docker
    plan: free
    rootDir: cadena-custodia-service
    dockerfilePath: ./Dockerfile
    buildFilter:
      paths: ["cadena-custodia-service/**"]
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GATEWAY_API_URL
        value: https://forentrack-v2-gateway.onrender.com
  - type: web
    name: forentrack-v2-auditoria
    runtime: docker
    plan: free
    rootDir: auditoria-service
    dockerfilePath: ./Dockerfile
    buildFilter:
      paths: ["auditoria-service/**"]
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GATEWAY_API_URL
        value: https://forentrack-v2-gateway.onrender.com
  - type: web
    name: forentrack-v2-laboratorio
    runtime: docker
    plan: free
    rootDir: laboratorio-service
    dockerfilePath: ./Dockerfile
    buildFilter:
      paths: ["laboratorio-service/**"]
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GATEWAY_API_URL
        value: https://forentrack-v2-gateway.onrender.com
  - type: web
    name: forentrack-v2-gateway
    runtime: docker
    plan: free
    rootDir: api-gateway
    dockerfilePath: ./Dockerfile
    buildFilter:
      paths: ["api-gateway/**"]
    envVars:
      - key: USUARIOS_API_URL
        value: https://forentrack-v2-usuarios.onrender.com
      - key: CASOS_API_URL
        value: https://forentrack-v2-casos.onrender.com
      - key: EVIDENCIAS_API_URL
        value: https://forentrack-v2-evidencias.onrender.com
      - key: CUSTODIA_API_URL
        value: https://forentrack-v2-custodia.onrender.com
