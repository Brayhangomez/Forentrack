# Blueprint de Render: crea los 8 servicios de ForenTrack 2.0 (plan gratuito).
# Render > New > Blueprint > este repositorio. Solo pide MONGODB_URI en forentrack-v2-usuarios; los demás la toman de ahí:
# el perfil "render" asigna a cada servicio su propia base forentrack_<servicio>.
# JWT_SECRET y SEED_PASSWORD los genera Render (grupo forentrack-secretos).
# Si Render asigna una URL distinta a la prevista (nombre ocupado), corrige GATEWAY_API_URL y las *_API_URL.
envVarGroups:
  - name: forentrack-secretos
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_PASSWORD
        generateValue: true
services:
  - type: web
    name: forentrack-v2-usuarios
    runtime: docker
    plan: free
    region: virginia
    rootDir: usuarios-service
    dockerfilePath: ./Dockerfile
    buildFilter:
      paths: ["usuarios-service/**"]
    envVars:
      - key: MONGODB_URI
        sync: false
      - fromGroup: forentrack-secretos
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: GATEWAY_API_URL
        value: https://forentrack-v2-gateway.onrender.com
  - type: web
    name: forentrack-v2-casos
    runtime: docker
    plan: free
    region: virginia
    rootDir: casos-service
    dockerfilePath: ./Dockerfile
    buildFilter:
      paths: ["casos-service/**"]
    envVars:
      - key: MONGODB_URI  # misma conexión de Atlas que forentrack-v2-usuarios (cada servicio usa su base)
        fromService:
          type: web
          name: forentrack-v2-usuarios
          envVarKey: MONGODB_URI
      - fromGroup: forentrack-secretos
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: GATEWAY_API_URL
        value: https://forentrack-v2-gateway.onrender.com
  - type: web
    name: forentrack-v2-evidencias
    runtime: docker
    plan: free
    region: virginia
    rootDir: evidencias-service
    dockerfilePath: ./Dockerfile
