          name: forentrack-v2-usuarios
          envVarKey: MONGODB_URI
      - fromGroup: forentrack-secretos
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: GATEWAY_API_URL
        value: https://forentrack-v2-gateway.onrender.com
  - type: web
    name: forentrack-v2-custodia
    runtime: docker
    plan: free
    region: virginia
    rootDir: cadena-custodia-service
    dockerfilePath: ./Dockerfile
    buildFilter:
      paths: ["cadena-custodia-service/**"]
    envVars:
      - key: MONGODB_URI  # misma conexión de Atlas que forentrack-v2-usuarios (cada servicio usa su base)
        fromService:
          type: web
          name: forentrack-v2-usuarios
          envVarKey: MONGODB_URI
      - fromGroup: forentrack-secretos
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: GATEWAY_API_URL
        value: https://forentrack-v2-gateway.onrender.com
  - type: web
    name: forentrack-v2-auditoria
    runtime: docker
    plan: free
    region: virginia
    rootDir: auditoria-service
    dockerfilePath: ./Dockerfile
    buildFilter:
      paths: ["auditoria-service/**"]
    envVars:
      - key: MONGODB_URI  # misma conexión de Atlas que forentrack-v2-usuarios (cada servicio usa su base)
        fromService:
          type: web
          name: forentrack-v2-usuarios
          envVarKey: MONGODB_URI
      - fromGroup: forentrack-secretos
      - key: SPRING_PROFILES_ACTIVE
