# Blueprint de Render: crea los 8 servicios de ForenTrack 2.0 (plan gratuito).
# Render > New > Blueprint > este repositorio. Los valores con sync: false se piden al crear el Blueprint
# (MONGODB_URI con una base distinta por servicio y el mismo JWT_SECRET en los 6 servicios).
# Si Render asigna una URL distinta a la prevista (nombre ocupado), corrige GATEWAY_API_URL y las *_API_URL.
services:
  - type: web
    name: forentrack-v2-usuarios
    runtime: docker
    plan: free
    rootDir: usuarios-service
    dockerfilePath: ./Dockerfile
    buildFilter:
      paths: ["usuarios-service/**"]
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GATEWAY_API_URL
        value: https://forentrack-v2-gateway.onrender.com
      - key: SEED_PASSWORD  # contraseña aleatoria de los usuarios de prueba (se ve en el dashboard)
        generateValue: true
  - type: web
    name: forentrack-v2-casos
    runtime: docker
    plan: free
    rootDir: casos-service
    dockerfilePath: ./Dockerfile
    buildFilter:
      paths: ["casos-service/**"]
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GATEWAY_API_URL
        value: https://forentrack-v2-gateway.onrender.com
  - type: web
    name: forentrack-v2-evidencias
    runtime: docker
    plan: free
    rootDir: evidencias-service
    dockerfilePath: ./Dockerfile
    buildFilter:
      paths: ["evidencias-service/**"]
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
