    buildFilter:
      paths: ["laboratorio-service/**"]
    envVars:
      - key: MONGODB_URI  # misma conexión de Atlas que forentrack-v2-usuarios (cada servicio usa su base)
        fromService:
          type: web
          name: forentrack-v2-usuarios
          envVarKey: MONGODB_URI
      - fromGroup: forentrack-secretos
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: GATEWAY_API_URL
        value: https://forentrack-v2-gateway.onrender.com
  - type: web
    name: forentrack-v2-gateway
    runtime: docker
    plan: free
    region: virginia
    rootDir: api-gateway
    dockerfilePath: ./Dockerfile
    buildFilter:
      paths: ["api-gateway/**"]
    envVars:
      - key: USUARIOS_API_URL
        value: https://forentrack-v2-usuarios.onrender.com
      - key: CASOS_API_URL
        value: https://forentrack-v2-casos.onrender.com
