        value: https://forentrack-v2-auditoria.onrender.com
      - key: LABORATORIO_API_URL
        value: https://forentrack-v2-laboratorio.onrender.com
  - type: web
    name: forentrack-v2-web
    runtime: docker
    plan: free
    rootDir: forentrack-web
    dockerfilePath: ./Dockerfile
    buildFilter:
      paths: ["forentrack-web/**"]
