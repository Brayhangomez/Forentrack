spring.application.name=api-gateway
server.port=${PORT:8090}

# Spring Cloud Gateway 5.x usa el prefijo spring.cloud.gateway.server.webflux
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=5000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=60s

# Rutas: /api/v1/** va al servicio dueño y /docs/<servicio>/** a su OpenAPI (sin el prefijo)

spring.cloud.gateway.server.webflux.routes[0].id=usuarios
spring.cloud.gateway.server.webflux.routes[0].uri=${USUARIOS_API_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/auth/**,/api/v1/usuarios,/api/v1/usuarios/**
spring.cloud.gateway.server.webflux.routes[1].id=docs-usuarios
spring.cloud.gateway.server.webflux.routes[1].uri=${USUARIOS_API_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/docs/usuarios/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=2

spring.cloud.gateway.server.webflux.routes[2].id=casos
spring.cloud.gateway.server.webflux.routes[2].uri=${CASOS_API_URL:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/casos,/api/v1/casos/**
spring.cloud.gateway.server.webflux.routes[3].id=docs-casos
spring.cloud.gateway.server.webflux.routes[3].uri=${CASOS_API_URL:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/docs/casos/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=StripPrefix=2

spring.cloud.gateway.server.webflux.routes[4].id=evidencias
