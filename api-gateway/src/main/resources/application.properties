# Swagger UI unificado: http://localhost:8090/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=usuarios-service
springdoc.swagger-ui.urls[0].url=/docs/usuarios/v3/api-docs
springdoc.swagger-ui.urls[1].name=casos-service
springdoc.swagger-ui.urls[1].url=/docs/casos/v3/api-docs
springdoc.swagger-ui.urls[2].name=evidencias-service
springdoc.swagger-ui.urls[2].url=/docs/evidencias/v3/api-docs
