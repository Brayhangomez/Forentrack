spring.cloud.gateway.server.webflux.routes[5].id=docs-evidencias
spring.cloud.gateway.server.webflux.routes[5].uri=${EVIDENCIAS_API_URL:http://localhost:8083}
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/docs/evidencias/**
spring.cloud.gateway.server.webflux.routes[5].filters[0]=StripPrefix=2

spring.cloud.gateway.server.webflux.routes[6].id=custodia
spring.cloud.gateway.server.webflux.routes[6].uri=${CUSTODIA_API_URL:http://localhost:8084}
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/v1/custodia/**
spring.cloud.gateway.server.webflux.routes[7].id=docs-custodia
spring.cloud.gateway.server.webflux.routes[7].uri=${CUSTODIA_API_URL:http://localhost:8084}
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/docs/custodia/**
spring.cloud.gateway.server.webflux.routes[7].filters[0]=StripPrefix=2

spring.cloud.gateway.server.webflux.routes[8].id=auditoria
spring.cloud.gateway.server.webflux.routes[8].uri=${AUDITORIA_API_URL:http://localhost:8085}
spring.cloud.gateway.server.webflux.routes[8].predicates[0]=Path=/api/v1/auditoria/**
spring.cloud.gateway.server.webflux.routes[9].id=docs-auditoria
spring.cloud.gateway.server.webflux.routes[9].uri=${AUDITORIA_API_URL:http://localhost:8085}
spring.cloud.gateway.server.webflux.routes[9].predicates[0]=Path=/docs/auditoria/**
