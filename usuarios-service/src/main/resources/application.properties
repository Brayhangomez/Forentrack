spring.application.name=usuarios-service
server.port=${PORT:8081}

# Base MongoDB propia del servicio
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/usuarios_db}
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/usuarios_db}
spring.data.mongodb.auto-index-creation=true

# Secreto compartido con usuarios-service (obligatorio, mínimo 32 caracteres)
app.jwt.secret=${JWT_SECRET:}

# Todas las llamadas entre servicios pasan por el API Gateway
gateway.api.url=${GATEWAY_API_URL:http://localhost:8090}

springdoc.swagger-ui.path=/swagger-ui.html

app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# Usuarios de prueba (uno por rol). Los valores por defecto son SOLO para desarrollo:
# en Render define SEED_PASSWORD o la variable de cada rol, o desactiva con SEED_ENABLED=false.
app.seed.enabled=${SEED_ENABLED:true}
app.seed.dominio=${SEED_DOMINIO:forentrack.test}
app.admin.correo=${ADMIN_CORREO:admin@forentrack.test}
app.seed.passwords.ADMINISTRADOR=${ADMIN_PASSWORD:${SEED_PASSWORD:Forentrack2026!}}
app.seed.passwords.INVESTIGADOR=${INVESTIGADOR_PASSWORD:${SEED_PASSWORD:Forentrack2026!}}
app.seed.passwords.PERITO=${PERITO_PASSWORD:${SEED_PASSWORD:Forentrack2026!}}
app.seed.passwords.CUSTODIO=${CUSTODIO_PASSWORD:${SEED_PASSWORD:Forentrack2026!}}
app.seed.passwords.FISCAL=${FISCAL_PASSWORD:${SEED_PASSWORD:Forentrack2026!}}
app.seed.passwords.AUDITOR=${AUDITOR_PASSWORD:${SEED_PASSWORD:Forentrack2026!}}
app.seed.passwords.TECNICO_CAMPO=${TECNICO_CAMPO_PASSWORD:${SEED_PASSWORD:Forentrack2026!}}
app.seed.passwords.ANALISTA_DIGITAL=${ANALISTA_DIGITAL_PASSWORD:${SEED_PASSWORD:Forentrack2026!}}
app.seed.passwords.JEFE_LABORATORIO=${JEFE_LABORATORIO_PASSWORD:${SEED_PASSWORD:Forentrack2026!}}
app.seed.passwords.REVISOR_LEGAL=${REVISOR_LEGAL_PASSWORD:${SEED_PASSWORD:Forentrack2026!}}
